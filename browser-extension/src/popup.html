<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TokenSqueeze</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: block; margin: 8px 0 4px; }
      input, select { width: 100%; padding: 4px 6px; box-sizing: border-box; }
      button { margin-top: 10px; padding: 6px 10px; }
      .row { display: flex; gap: 6px; align-items: center; }
      .ok { color: #1f7a3a; } .err { color: #a33232; }
    </style>
  </head>
  <body>
    <h1>⚡ TokenSqueeze</h1>
    <label for="endpoint">Endpoint</label>
    <input id="endpoint" placeholder="http://127.0.0.1:8765/compress" />
    <label for="strategy">Strategy</label>
    <select id="strategy">
      <option value="auto">auto</option>
      <option value="sns">sns</option>
      <option value="llmlingua2">llmlingua2</option>
      <option value="gist">gist</option>
    </select>
    <div class="row">
      <button id="save">Save</button>
      <button id="ping">Ping server</button>
    </div>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
