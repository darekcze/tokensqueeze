[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensqueeze"
version = "0.1.0"
description = "Hybrid prompt compression for LLMs: SNS shorthand rules, optional LLMLingua-2 semantic pruning, adaptive strategy selection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TokenSqueeze contributors" }]
keywords = ["llm", "prompt", "compression", "tokens", "tokenizer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["tiktoken>=0.5"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
llmlingua = ["llmlingua>=0.2", "transformers>=4.40"]
dev = ["pytest>=7", "tiktoken>=0.5", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26"]

[project.scripts]
squeeze = "tokensqueeze.cli:main"

[project.urls]
Homepage = "https://github.com/darekcze/tokensqueeze"
Source = "https://github.com/darekcze/tokensqueeze"
Issues = "https://github.com/darekcze/tokensqueeze/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokensqueeze*"]
exclude = ["tests*", "vscode-extension*", "browser-extension*", "openclaw-plugin*"]

[tool.setuptools.package-data]
tokensqueeze = ["classifier_model.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
